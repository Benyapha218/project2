<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ด — สวนผลไม้ จังหวัดราชบุรี</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f4f6f5;
    font-family: 'Segoe UI', 'Sarabun', Tahoma, sans-serif;
    color: #1f2937;
  }

  /* ===== Navbar ===== */
  header.navbar {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand .logo-emoji {
    font-size: 30px;
    line-height: 1;
  }

  .brand .brand-text h1 {
    font-size: 20px;
    color: #1f4d2e;
    margin: 0;
  }

  .brand .brand-text small {
    display: block;
    font-size: 11px;
    color: #17663f;
    text-decoration: underline;
  }

  nav.main-nav {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  nav.main-nav a {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: #374151;
    font-size: 15px;
    padding: 6px 4px;
  }

  nav.main-nav a.active {
    background: #17663f;
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
  }

  nav.main-nav a:hover:not(.active) {
    color: #17663f;
  }

  .nav-icon {
    font-size: 16px;
  }

  /* ===== Main content ===== */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 32px 60px;
  }

  .garden-select-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .garden-select-row .label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: #374151;
    white-space: nowrap;
  }

  select#gardenSelect {
    flex: 1;
    max-width: 800px;
    background: #4b6455;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 600;
    appearance: none;
    cursor: pointer;
  }

/* ===== แถบเลือกสวน ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .toolbar .label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: #374151;
    white-space: nowrap;
  }

  .select-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
    max-width: 500px;
  }

  select#gardenSelect {
    width: 100%;
    background: #4b6455;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 13px 40px 13px 18px;
    font-size: 15px;
    font-weight: 600;
    appearance: none;
    cursor: pointer;
  }

  .select-wrap::after {
    content: "▾";
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #ffffff;
    pointer-events: none;
  }

  .toolbar button {
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ===== Stat cards ===== */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 18px 24px 26px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  }

  .stat-card .stat-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #4b5563;
    margin-bottom: 18px;
  }

  .stat-card .stat-value {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #9ca3af;
  }

  /* ===== Chart cards ===== */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .chart-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 20px 24px 12px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  }

  .chart-card .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .chart-card .chart-header h2 {
    font-size: 17px;
    color: #17663f;
    margin: 0;
  }

  .year-switch {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #374151;
  }

  .year-switch button {
    background: none;
    border: none;
    font-size: 14px;
    cursor: pointer;
    color: #374151;
  }

  .chart-card .chart-subtitle {
    font-size: 12px;
    color: #9ca3af;
    margin: 4px 0 16px;
  }

  .chart-frame {
    width: 100%;
    height: 220px;
  }

  .chart-frame svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .axis-line {
    stroke: #e5e7eb;
    stroke-width: 1;
  }

  .axis-label {
    fill: #9ca3af;
    font-size: 11px;
  }

  .month-label {
    fill: #6b7280;
    font-size: 11px;
  }

  @media (max-width: 900px) {
    .stats-row, .charts-row {
      grid-template-columns: 1fr;
    }
    nav.main-nav {
      flex-wrap: wrap;
      gap: 14px;
    }
  }
</style>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <span class="logo-emoji">🗺️🍊</span>
      <div class="brand-text">
        <h1>สวนผลไม้ จังหวัดราชบุรี</h1>
        <small>ท่องเที่ยวเชิงเกษตรผลไม้ จ.ราชบุรี</small>
      </div>
    </div>

    <nav class="main-nav">
      <a href="index.html" class="active"><span class="nav-icon">🏠</span> แดชบอร์ด</a>
      <!-- <% if (user && user.role === 'owner') { %> -->
      <a href="garden-list.html"><span class="nav-icon">🗺️</span> ข้อมูลสวน</a>
      <!-- <% } %> -->
      <a href="bookings.html"><span class="nav-icon">📋</span> การจอง</a>
      <a href="map.html"><span class="nav-icon">📍</span> แผนที่</a>
      <a href="account.html"><span class="nav-icon">👤</span> บัญชี</a>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <span class="label">🌱 เลือกสวน</span>
      <div class="select-wrap">
        <select id="gardenSelect"></select>
      </div>
    </div>

    <section class="stats-row">
      <div class="stat-card">
        <div class="stat-title">รออนุมัติ ☰✔</div>
        <div class="stat-value" id="statPending">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">จำนวนรีวิว ★</div>
        <div class="stat-value" id="statReviews">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">คะแนนเฉลี่ย ☆</div>
        <div class="stat-value" id="statAvgScore">--</div>
      </div>
    </section>

    <section class="charts-row">
      <div class="chart-card">
        <div class="chart-header">
          <h2>ยอดจอง</h2>
          <div class="year-switch">
            <button type="button" aria-label="ปีก่อนหน้า">◀</button>
            <span>ปี 2569</span>
            <button type="button" aria-label="ปีถัดไป">▶</button>
          </div>
        </div>
        <p class="chart-subtitle">ยอดการจอง(รายเดือน 12 เดือนล่าสุด)</p>
        <div class="chart-frame">
          <svg viewBox="0 0 560 220" preserveAspectRatio="none">
            <!-- เส้นกริดแนวนอน (แกน Y: 0-1 ตามภาพต้นฉบับ ยังไม่มีข้อมูลจริง) -->
            <line class="axis-line" x1="30" y1="20" x2="560" y2="20"></line>
            <line class="axis-line" x1="30" y1="180" x2="560" y2="180"></line>
            <text class="axis-label" x="10" y="24">1</text>
            <text class="axis-label" x="10" y="184">0</text>

            <!-- เดือน ม.ค. - ธ.ค. -->
            <g class="month-label">
              <text x="45" y="200">ม.ค.</text>
              <text x="88" y="200">ก.พ.</text>
              <text x="131" y="200">มี.ค.</text>
              <text x="174" y="200">เม.ย.</text>
              <text x="217" y="200">พ.ค.</text>
              <text x="260" y="200">มิ.ย.</text>
              <text x="303" y="200">ก.ค.</text>
              <text x="346" y="200">ส.ค.</text>
              <text x="389" y="200">ก.ย.</text>
              <text x="432" y="200">ต.ค.</text>
              <text x="475" y="200">พ.ย.</text>
              <text x="518" y="200">ธ.ค.</text>
            </g>
            <!-- TODO: เมื่อเชื่อม MongoDB แล้ว วาดแท่งกราฟ (bar) จากข้อมูลยอดจองรายเดือนตรงนี้ -->
          </svg>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <h2>คะแนนรีวิวเฉลี่ย</h2>
          <div class="year-switch">
            <button type="button" aria-label="ปีก่อนหน้า">◀</button>
            <span>ปี 2569</span>
            <button type="button" aria-label="ปีถัดไป">▶</button>
          </div>
        </div>
        <p class="chart-subtitle">คะแนนรีวิวเฉลี่ย(รายเดือน)</p>
        <div class="chart-frame">
          <svg viewBox="0 0 560 220" preserveAspectRatio="none">
            <!-- เส้นกริดแนวนอน (แกน Y: 0-5 คะแนน) -->
            <line class="axis-line" x1="30" y1="20" x2="560" y2="20"></line>
            <line class="axis-line" x1="30" y1="52" x2="560" y2="52"></line>
            <line class="axis-line" x1="30" y1="84" x2="560" y2="84"></line>
            <line class="axis-line" x1="30" y1="116" x2="560" y2="116"></line>
            <line class="axis-line" x1="30" y1="148" x2="560" y2="148"></line>
            <line class="axis-line" x1="30" y1="180" x2="560" y2="180"></line>
            <text class="axis-label" x="10" y="24">5</text>
            <text class="axis-label" x="10" y="56">4</text>
            <text class="axis-label" x="10" y="88">3</text>
            <text class="axis-label" x="10" y="120">2</text>
            <text class="axis-label" x="10" y="152">1</text>
            <text class="axis-label" x="10" y="184">0</text>

            <g class="month-label">
              <text x="45" y="200">ม.ค.</text>
              <text x="88" y="200">ก.พ.</text>
              <text x="131" y="200">มี.ค.</text>
              <text x="174" y="200">เม.ย.</text>
              <text x="217" y="200">พ.ค.</text>
              <text x="260" y="200">มิ.ย.</text>
              <text x="303" y="200">ก.ค.</text>
              <text x="346" y="200">ส.ค.</text>
              <text x="389" y="200">ก.ย.</text>
              <text x="432" y="200">ต.ค.</text>
              <text x="475" y="200">พ.ย.</text>
              <text x="518" y="200">ธ.ค.</text>
            </g>
            <!-- TODO: เมื่อเชื่อม MongoDB แล้ว วาดเส้น/แท่งคะแนนรีวิวเฉลี่ยรายเดือนตรงนี้ -->
          </svg>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ยังไม่เชื่อมต่อ MongoDB — ค่าทั้งหมดเป็น placeholder ("--") ไปก่อน

  </script>

</body>
</html>
