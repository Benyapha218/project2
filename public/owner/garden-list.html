<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อมูลสวน — สวนผลไม้ จังหวัดราชบุรี</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f4f6f5;
    font-family: 'Segoe UI', 'Sarabun', Tahoma, sans-serif;
    color: #1f2937;
  }

  /* ===== Navbar ===== */
  header.navbar {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand .logo-emoji {
    font-size: 30px;
  }

  .brand .brand-text h1 {
    font-size: 20px;
    color: #1f4d2e;
    margin: 0;
  }

  .brand .brand-text small {
    display: block;
    font-size: 11px;
    color: #17663f;
    text-decoration: underline;
  }

  nav.main-nav {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  nav.main-nav a {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: #374151;
    font-size: 15px;
    padding: 6px 4px;
  }

  nav.main-nav a.active {
    background: #17663f;
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
  }

  nav.main-nav a:hover:not(.active) {
    color: #17663f;
  }

  /* ===== Main ===== */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 32px 60px;
  }

  /* ===== แถบเลือกสวน ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .toolbar .label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: #374151;
    white-space: nowrap;
  }

  .select-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
    max-width: 500px;
  }

  select#gardenSelect {
    width: 100%;
    background: #4b6455;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 13px 40px 13px 18px;
    font-size: 15px;
    font-weight: 600;
    appearance: none;
    cursor: pointer;
  }

  .select-wrap::after {
    content: "▾";
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #ffffff;
    pointer-events: none;
  }

  .toolbar button {
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-outline {
    background: #97ffd5;
    color: #374151;
  }
  .btn-outline:hover { background: #f3f4f6; }

  .btn-outline2 {
    background: #e5e7eb;
    color: #374151;
  }
  .btn-outline2:hover { background: #f3f4f6; }

  .btn-neutral {
    background: #faf88a;
    color: #374151;
  }
  .btn-neutral:hover { background: #d1d5db; }

  .btn-danger {
    background: #dc2626;
    color: #ffffff;
  }
  .btn-danger:hover { background: #b91c1c; }

  /* ===== การ์ดรายละเอียดสวน ===== */
  .detail-card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.07);
    padding: 32px 36px 40px;
  }

  .detail-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .detail-header h2 {
    font-size: 28px;
    color: #17663f;
    margin: 0;
    padding-bottom: 8px;
    border-bottom: 3px solid #17663f;
    display: inline-block;
  }

  .btn-edit {
    background: #17663f;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    text-decoration: none;
  }

  .btn-edit:hover { background: #124f31; }

  .tag-row {
    margin: 12px 0 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tag-pill {
    background: #374151;
    color: #ffffff;
    font-size: 12.5px;
    padding: 5px 14px;
    border-radius: 20px;
  }

  .info-map-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 24px;
  }

  .info-box {
    background: #f8f5ef;
    border-radius: 12px;
    padding: 20px 24px;
  }

  .info-box .info-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 14px;
    font-size: 14px;
  }

  .info-box .info-line {
    font-size: 14px;
    color: #374151;
    margin-bottom: 6px;
    line-height: 1.6;
  }

  .info-box .contact-heading {
    margin-top: 16px;
    font-size: 14px;
    color: #374151;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #374151;
    margin-bottom: 6px;
  }

  .contact-item .c-icon {
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }

  .map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 220px;
  }

  #mapView {
    width: 100%;
    height: 100%;
    min-height: 220px;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
  }

  .btn-navigate {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 500;
    background: #ffffff;
    color: #17663f;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-navigate:hover {
    background: #f0f9f2;
  }

  /* ===== แกลเลอรีรูปภาพ (แบบเลื่อน/ลากได้) ===== */
  .gallery-wrap {
    position: relative;
  }

  .gallery-track {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    cursor: grab;
    padding-bottom: 4px;
    /* ซ่อน scrollbar แต่ยังเลื่อนด้วยเมาส์/นิ้วได้ปกติ */
    scrollbar-width: none;
  }

  .gallery-track::-webkit-scrollbar {
    display: none;
  }

  .gallery-track.dragging {
    cursor: grabbing;
    scroll-snap-type: none;
  }

  .gallery-track img {
    flex: 0 0 calc((100% - 32px) / 3);
    scroll-snap-align: start;
    width: calc((100% - 32px) / 3);
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
    background: #e5ebe6;
    -webkit-user-drag: none;
    user-select: none;
  }

  .gallery-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    font-size: 16px;
    color: #17663f;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  .gallery-nav:hover {
    background: #f0f9f2;
  }

  .gallery-nav.prev { left: -18px; }
  .gallery-nav.next { right: -18px; }

  .gallery .no-image-box {
    text-align: center;
    color: #9ca3af;
    padding: 40px 0;
    background: #f3f4f6;
    border-radius: 12px;
  }

  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }

  .dots .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #d1d5db;
    cursor: pointer;
    border: none;
    padding: 0;
  }

  .dots .dot.active {
    background: #17663f;
  }

  #statusMessage {
    text-align: center;
    color: #6b7280;
    padding: 60px 0;
    font-size: 15px;
  }

  #statusMessage.error {
    color: #dc2626;
  }

  @media (max-width: 900px) {
    .info-map-row {
      grid-template-columns: 1fr;
    }
    .gallery {
      grid-template-columns: repeat(2, 1fr);
    }
    nav.main-nav {
      flex-wrap: wrap;
      gap: 14px;
    }
  }
</style>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <span class="logo-emoji">🗺️🍊</span>
      <div class="brand-text">
        <h1>สวนผลไม้ จังหวัดราชบุรี</h1>
        <small>ท่องเที่ยวเชิงเกษตรผลไม้ จ.ราชบุรี</small>
      </div>
    </div>
    <nav class="main-nav">
      <a href="index.html"><span>🏠</span> แดชบอร์ด</a>
      <a href="garden-list.html" class="active"><span>🗺️</span> ข้อมูลสวน</a>
      <a href="bookings.html"><span>📋</span> การจอง</a>
      <a href="map.html"><span>📍</span> แผนที่</a>
      <a href="account.html"><span>👤</span> บัญชี</a>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <button type="button" class="btn-outline2" onclick="location.href='add-garden2.html'"> &#10094; กลับ</button>
      <span class="label">🌱 เลือกสวน</span>
      <div class="select-wrap">
        <select id="gardenSelect"></select>
      </div>
      <button type="button" class="btn-outline" onclick="location.href='add-garden2.html'">เพิ่ม/แก้ไขข้อมูล</button>
      <button type="button" class="btn-neutral" onclick="location.href='add-garden1.html'">＋ เพิ่มสวน</button>
      <button type="button" class="btn-danger" id="deleteBtn">🗑 ลบสวน</button>
    </div>

    <div id="statusMessage">กำลังโหลดข้อมูลสวน...</div>
    <div class="detail-card" id="detailCard" style="display:none;"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    let allGardens = [];
    let currentGarden = null;
    let map = null;
    let marker = null;

    const statusMessage = document.getElementById('statusMessage');
    const detailCard = document.getElementById('detailCard');
    const gardenSelect = document.getElementById('gardenSelect');
    const deleteBtn = document.getElementById('deleteBtn');

    async function loadGardens() {
      try {
        const response = await fetch('/api/owner/gardens');
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'โหลดข้อมูลไม่สำเร็จ');

        allGardens = data.gardens || [];

        if (allGardens.length === 0) {
          statusMessage.textContent = 'ยังไม่มีข้อมูลสวนในระบบ — กด "+ เพิ่มสวน" เพื่อเริ่มต้น';
          detailCard.style.display = 'none';
          return;
        }

        populateSelect();
        renderGarden(allGardens[0]);

      } catch (err) {
        statusMessage.classList.add('error');
        statusMessage.textContent = 'เชื่อมต่อฐานข้อมูลไม่ได้ กรุณาตรวจสอบว่า server กำลังรันอยู่';
        console.error('Load gardens error:', err);
      }
    }

    function populateSelect() {
      gardenSelect.innerHTML = allGardens
        .map(g => `<option value="${g._id}">${escapeHtml(g.garden_name || 'ไม่ระบุชื่อสวน')}</option>`)
        .join('');
    }

    gardenSelect.addEventListener('change', () => {
      const selected = allGardens.find(g => g._id === gardenSelect.value);
      if (selected) renderGarden(selected);
    });

    function renderGarden(garden) {
      currentGarden = garden;
      gardenSelect.value = garden._id;

      statusMessage.style.display = 'none';
      detailCard.style.display = 'block';

      const name = escapeHtml(garden.garden_name || 'ไม่ระบุชื่อสวน');
      const desc = escapeHtml(garden.description || 'ยังไม่มีคำอธิบายสวน');

      const address = garden.address || {};
      const addressLine = [
        address.subdistrict ? `ต.${address.subdistrict}` : '',
        address.district ? `อ.${address.district}` : '',
        address.province ? `จ.${address.province}` : ''
      ].filter(Boolean).join(' ') || 'ยังไม่ระบุที่อยู่';

      const contact = garden.contact || {};

      detailCard.innerHTML = `
        <div class="detail-header">
          <h2>${name}</h2>
        </div>

        <div class="tag-row">
          <span class="tag-pill">สวนผลไม้</span>
        </div>

        <div class="info-map-row">
          <div class="info-box">
            <div class="info-title">ⓘ รายละเอียดข้อมูลสวน</div>
            <div class="info-line">${addressLine}</div>
            <div class="info-line" style="margin-top:10px; color:#6b7280;">${desc}</div>

            <div class="contact-heading">ติดต่อ</div>
            ${contact.phone ? `<div class="contact-item"><span class="c-icon">📞</span> ${escapeHtml(contact.phone)}</div>` : ''}
            ${contact.facebook ? `<div class="contact-item"><span class="c-icon">📘</span> ${escapeHtml(contact.facebook)}</div>` : ''}
            ${contact.line ? `<div class="contact-item"><span class="c-icon">💬</span> ${escapeHtml(contact.line)}</div>` : ''}
            ${(!contact.phone && !contact.facebook && !contact.line) ? `<div class="info-line" style="color:#9ca3af;">ยังไม่มีข้อมูลติดต่อ</div>` : ''}
          </div>

          <div class="map-wrap">
            <button type="button" class="btn-navigate" id="navigateBtn">🧭 นำทาง</button>
            <div id="mapView"></div>
          </div>
        </div>

        <div class="gallery-wrap" id="galleryWrap">
          <button type="button" class="gallery-nav prev" id="galleryPrev">‹</button>
          <div class="gallery-track" id="galleryTrack"></div>
          <button type="button" class="gallery-nav next" id="galleryNext">›</button>
        </div>
        <div class="dots" id="galleryDots"></div>
      `;

      renderMap(garden);
      renderGallery(garden);
    }

    function renderMap(garden) {
      const loc = garden.location || {};
      const lat = loc.lat || 13.5282;
      const lng = loc.lng || 99.8134;
      const hasRealLocation = !!(loc.lat && loc.lng);

      // ถ้ามีแผนที่เก่าอยู่ ให้ลบทิ้งก่อนสร้างใหม่ (เพราะสลับสวนแล้ว div ถูกสร้างใหม่ทุกครั้ง)
      if (map) {
        map.remove();
        map = null;
      }

      map = L.map('mapView', { zoomControl: true }).setView([lat, lng], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      if (hasRealLocation) {
        marker = L.marker([lat, lng]).addTo(map);
      }

      // เปิด Google Maps เพื่อนำทางไปยังพิกัดของสวน
      function openGoogleMapsDirections() {
        if (!hasRealLocation) {
          alert('สวนนี้ยังไม่มีการปักหมุดพิกัด กรุณาเพิ่มพิกัดก่อน');
          return;
        }
        const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
        window.open(url, '_blank');
      }

      // คลิกบนตัวแผนที่ (นอกเหนือจากการลาก/ซูม) ให้เปิด Google Maps นำทาง
      map.on('click', openGoogleMapsDirections);

      // ปุ่ม "นำทาง" ที่ลอยอยู่มุมขวาบนของแผนที่
      document.getElementById('navigateBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        openGoogleMapsDirections();
      });
    }

    function renderGallery(garden) {
      const images = garden.images || [];
      const galleryWrap = document.getElementById('galleryWrap');
      const galleryTrack = document.getElementById('galleryTrack');
      const galleryDots = document.getElementById('galleryDots');
      const prevBtn = document.getElementById('galleryPrev');
      const nextBtn = document.getElementById('galleryNext');

      if (images.length === 0) {
        galleryWrap.innerHTML = `<div class="no-image-box">ยังไม่มีรูปภาพสวนนี้</div>`;
        galleryDots.innerHTML = '';
        return;
      }

      galleryTrack.innerHTML = images
        .map(src => `<img src="${src}" alt="${escapeHtml(garden.garden_name || '')}" draggable="false">`)
        .join('');

      // ซ่อนลูกศรถ้ามีรูปน้อยกว่าหรือเท่ากับ 3 รูป (เลื่อนไม่จำเป็น)
      const needsNav = images.length > 3;
      prevBtn.style.display = needsNav ? 'flex' : 'none';
      nextBtn.style.display = needsNav ? 'flex' : 'none';

      // จุดไข่ปลาด้านล่าง แสดงตามจำนวนรูปทั้งหมด
      galleryDots.innerHTML = images.map((_, i) =>
        `<button type="button" class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></button>`
      ).join('');

      const dots = Array.from(galleryDots.querySelectorAll('.dot'));

      function scrollToIndex(index) {
        const imgEl = galleryTrack.children[index];
        if (!imgEl) return;
        galleryTrack.scrollTo({ left: imgEl.offsetLeft - galleryTrack.offsetLeft, behavior: 'smooth' });
      }

      function updateActiveDot() {
        // หารูปที่อยู่ใกล้จุดเริ่มต้นของ track มากที่สุด ถือว่าเป็นรูปที่กำลังดูอยู่
        const trackLeft = galleryTrack.scrollLeft;
        let closestIndex = 0;
        let closestDistance = Infinity;

        Array.from(galleryTrack.children).forEach((imgEl, i) => {
          const distance = Math.abs(imgEl.offsetLeft - galleryTrack.offsetLeft - trackLeft);
          if (distance < closestDistance) {
            closestDistance = distance;
            closestIndex = i;
          }
        });

        dots.forEach((dot, i) => dot.classList.toggle('active', i === closestIndex));
      }

      dots.forEach(dot => {
        dot.addEventListener('click', () => scrollToIndex(parseInt(dot.dataset.index, 10)));
      });

      // ปุ่มลูกศร: เลื่อนไปทีละ 1 รูป
      let currentIndex = 0;
      prevBtn.onclick = () => {
        currentIndex = Math.max(0, currentIndex - 1);
        scrollToIndex(currentIndex);
      };
      nextBtn.onclick = () => {
        currentIndex = Math.min(images.length - 1, currentIndex + 1);
        scrollToIndex(currentIndex);
      };

      galleryTrack.addEventListener('scroll', () => {
        updateActiveDot();
      }, { passive: true });

      // รองรับการ "ลาก" ด้วยเมาส์บนเดสก์ท็อป (มือถือ/แท็บเล็ตลากด้วยนิ้วได้อยู่แล้วโดยธรรมชาติ)
      let isDragging = false;
      let dragStartX = 0;
      let scrollStart = 0;

      galleryTrack.addEventListener('mousedown', (e) => {
        isDragging = true;
        galleryTrack.classList.add('dragging');
        dragStartX = e.pageX;
        scrollStart = galleryTrack.scrollLeft;
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          galleryTrack.classList.remove('dragging');
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const delta = e.pageX - dragStartX;
        galleryTrack.scrollLeft = scrollStart - delta;
      });
    }

    deleteBtn.addEventListener('click', async () => {
      if (!currentGarden) return;

      const confirmDelete = confirm(`ต้องการลบข้อมูลสวน "${currentGarden.garden_name}" ใช่หรือไม่? การลบนี้ไม่สามารถย้อนกลับได้`);
      if (!confirmDelete) return;

      try {
        const response = await fetch(`/api/owner/gardens/${currentGarden._id}`, { method: 'DELETE' });
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'ลบข้อมูลไม่สำเร็จ');

        alert('ลบข้อมูลสวนสำเร็จ');
        await loadGardens();

      } catch (err) {
        alert('เกิดข้อผิดพลาด: ' + err.message);
        console.error('Delete garden error:', err);
      }
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadGardens();
  </script>

</body>
</html>
