<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อมูลสวน — สวนผลไม้ จังหวัดราชบุรี</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f4f6f5;
    font-family: 'Segoe UI', 'Sarabun', Tahoma, sans-serif;
    color: #1f2937;
  }

  /* ===== Navbar ===== */
  header.navbar {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    margin-bottom: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand .logo-emoji {
    font-size: 30px;
    line-height: 1;
  }

  .brand .brand-text h1 {
    font-size: 20px;
    color: #1f4d2e;
    margin: 0;
  }

  .brand .brand-text small {
    display: block;
    font-size: 11px;
    color: #17663f;
    text-decoration: underline;
  }

  nav.main-nav {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  nav.main-nav a {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: #374151;
    font-size: 15px;
    padding: 6px 4px;
  }

  nav.main-nav a.active {
    background: #17663f;
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
  }

  nav.main-nav a:hover:not(.active) {
    color: #17663f;
  }

  .nav-icon {
    font-size: 16px;
  }

  /* ===== Card หลัก ===== */
  .form-card {
    max-width: 1180px;
    margin: 0 auto 24px;
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.07);
    padding: 32px 48px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  h2.section-title {
    font-size: 22px;
    color: #1f2937;
    margin: 0;
    padding-left: 12px;
    border-left: 4px solid #17663f;
  }

  h2.section-title.spaced {
    margin-top: 32px;
    margin-bottom: 22px;
  }

  label.field-label {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 8px;
    margin-top: 20px;
  }

  label.field-label:first-of-type {
    margin-top: 0;
  }

  input[type="text"],
  input[type="tel"],
  textarea {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    color: #1f2937;
    transition: border-color 0.15s ease;
  }

  input::placeholder,
  textarea::placeholder {
    color: #9ca3af;
  }

  input:focus,
  textarea:focus {
    border-color: #17663f;
    box-shadow: 0 0 0 3px rgba(23, 102, 63, 0.12);
  }

  textarea {
    resize: vertical;
    min-height: 130px;
  }

  /* ===== ช่องทางติดต่อ ===== */
  .contact-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 14px;
  }

  .contact-row .contact-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    color: #ffffff;
  }

  .contact-icon.phone { background: #4b5563; }
  .contact-icon.facebook { background: #1877f2; }
  .contact-icon.line { background: #06c755; }

  .contact-row input {
    flex: 1;
  }

  /* ===== อัพโหลดรูป ===== */
  .upload-box {
    margin-top: 12px;
    border: 2px dashed #d1d5db;
    border-radius: 12px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #6b7280;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .upload-box:hover {
    border-color: #17663f;
    background: #f7faf8;
  }

  .upload-box .upload-icon {
    width: 54px;
    height: 54px;
    border-radius: 10px;
    border: 1px solid #9ca3af;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    position: relative;
  }

  .upload-box .upload-icon::after {
    content: "+";
    position: absolute;
    top: -6px;
    right: -6px;
    background: #ffffff;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #374151;
    border: 1px solid #9ca3af;
  }

  .upload-box span.upload-text {
    font-size: 14px;
  }

  #imagePreview {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  #imagePreview img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
  }

  /* ===== ที่ตั้ง: กริด 2 คอลัมน์ ===== */
  .address-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 32px;
  }

  .address-grid .full-row {
    grid-column: 1 / -1;
  }

  .coord-row {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }

  .coord-row input {
    flex: 1;
  }

  .coord-row button {
    background: #4b6455;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .coord-row button:hover {
    background: #3a4f42;
  }

  /* ===== แผนที่ ===== */
  .map-section {
    margin-top: 20px;
  }

  .map-hint {
    font-size: 13px;
    color: #dc2626;
    margin-bottom: 10px;
  }

  #mapPlaceholder {
    width: 100%;
    height: 320px;
    border-radius: 12px;
    border: 1px solid #d1d5db;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  .map-note {
    margin-top: 8px;
    font-size: 12px;
    color: #6b7280;
  }

  .map-note strong {
    color: #17663f;
  }

  /* ===== ปุ่มด้านล่าง ===== */
  .action-row {
    display: flex;
    gap: 16px;
    margin-top: 36px;
  }

  .btn-save {
    background: #17663f;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 15px 40px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-save:hover {
    background: #124f31;
  }

  .btn-back {
    background: #ffffff;
    color: #374151;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 15px 40px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-back:hover {
    background: #f3f4f6;
  }

  #formMessage {
    margin-top: 14px;
    font-size: 14px;
  }

  @media (max-width: 800px) {
    .form-card {
      padding: 28px 22px 36px;
    }
    .address-grid {
      grid-template-columns: 1fr;
    }
    nav.main-nav {
      flex-wrap: wrap;
      gap: 14px;
    }
  }
</style>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <span class="logo-emoji">🗺️🍊</span>
      <div class="brand-text">
        <h1>สวนผลไม้ จังหวัดราชบุรี</h1>
        <small>ท่องเที่ยวเชิงเกษตรผลไม้ จ.ราชบุรี</small>
      </div>
    </div>

    <nav class="main-nav">
      <a href="index.html"><span class="nav-icon">🏠</span> แดชบอร์ด</a>
      <a href="add-garden1.html" class="active"><span class="nav-icon">🗺️</span> ข้อมูลสวน</a>
      <a href="bookings.html"><span class="nav-icon">📋</span> การจอง</a>
      <a href="map.html"><span class="nav-icon">📍</span> แผนที่</a>
      <a href="account.html"><span class="nav-icon">👤</span> บัญชี</a>
    </nav>
  </header>

  <div class="form-card">
    <form id="gardenForm">

      <div class="section-header">
        <h2 class="section-title">ข้อมูลสวน</h2>
      </div>

      <label class="field-label" for="gardenName">ชื่อสวน</label>
      <input type="text" id="gardenName" name="gardenName" placeholder="กรอกชื่อสวน">

      <label class="field-label" for="gardenDesc">ข้อมูลแนะนำสวน</label>
      <textarea id="gardenDesc" name="gardenDesc" placeholder="กรอกรายละเอียด หรือจุดเด่นของสวน"></textarea>

      <label class="field-label">ช่องทางข้อมูลติดต่อ</label>

      <div class="contact-row">
        <span class="contact-icon phone">📞</span>
        <input type="tel" id="phone" name="phone" placeholder="กรอกเบอร์โทรศัพท์">
      </div>

      <div class="contact-row">
        <span class="contact-icon facebook">f</span>
        <input type="text" id="facebook" name="facebook" placeholder="กรอกชื่อเพจ Facebook หรือลิงก์">
      </div>

      <div class="contact-row">
        <span class="contact-icon line">L</span>
        <input type="text" id="lineId" name="lineId" placeholder="กรอก Line ID หรือ @Line">
      </div>

      <label class="field-label">รูปภาพสวน</label>
      <div class="upload-box" id="uploadBox">
        <div class="upload-icon">🏔️</div>
        <span class="upload-text">อัพโหลดไฟล์ที่นี่</span>
        <input type="file" id="imageInput" accept="image/*" multiple hidden>
      </div>
      <div id="imagePreview"></div>

      <h2 class="section-title spaced">ข้อมูลที่ตั้ง</h2>

      <div class="address-grid">
        <div>
          <label class="field-label" for="addressNo">ที่อยู่เลขที่</label>
          <input type="text" id="addressNo" name="addressNo" placeholder="กรอกที่อยู่เลขที่">
        </div>
        <div>
          <label class="field-label" for="moo">หมู่</label>
          <input type="text" id="moo" name="moo" placeholder="กรอกหมู่">
        </div>

        <div>
          <label class="field-label" for="soi">ซอย</label>
          <input type="text" id="soi" name="soi" placeholder="กรอกซอย">
        </div>
        <div>
          <label class="field-label" for="road">ถนน</label>
          <input type="text" id="road" name="road" placeholder="กรอกถนน">
        </div>

        <div>
          <label class="field-label" for="subdistrict">ตำบล</label>
          <input type="text" id="subdistrict" name="subdistrict" placeholder="กรอกตำบล">
        </div>
        <div>
          <label class="field-label" for="district">อำเภอ</label>
          <input type="text" id="district" name="district" placeholder="กรอกอำเภอ">
        </div>

        <div class="full-row">
          <label class="field-label" for="province">จังหวัด</label>
          <input type="text" id="province" name="province" placeholder="กรอกจังหวัด" style="max-width: 48%;">
        </div>

        <div class="full-row">
          <label class="field-label">ค้นหาพิกัด (ละติจูด / ลองจิจูด)</label>
          <div class="coord-row" style="max-width: 48%;">
            <input type="text" id="lat" name="lat" placeholder="ละติจูด">
            <input type="text" id="lng" name="lng" placeholder="ลองจิจูด">
            <button type="button" id="findCoordBtn">ค้นหาพิกัด</button>
          </div>
        </div>

        <div class="full-row map-section">
          <p class="map-hint">คลิกบนแผนที่ หรือลากหมุด เพื่อเลือกพิกัด</p>
          <div id="mapPlaceholder"></div>
          <p class="map-note">พิกัดที่เลือก: <strong id="coordDisplay">ยังไม่ได้เลือกพิกัด</strong></p>
        </div>
      </div>

      <div class="action-row">
        <!-- 🛠️ เอา onclick เปลี่ยนหน้าออก ให้ JS ทำงานจาก form submit -->
        <button type="submit" class="btn-save">บันทึกข้อมูลสวน</button>
        <button type="button" class="btn-back" onclick="history.back()">กลับ</button>
      </div>

      <div id="formMessage"></div>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script>
    // ===== อัพโหลดรูปภาพ =====
    const uploadBox = document.getElementById('uploadBox');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');

    uploadBox.addEventListener('click', () => imageInput.click());

    imageInput.addEventListener('change', () => {
      imagePreview.innerHTML = '';
      Array.from(imageInput.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = document.createElement('img');
          img.src = e.target.result;
          imagePreview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });

    // ===== แผนที่ Leaflet =====
    const latInput = document.getElementById('lat');
    const lngInput = document.getElementById('lng');
    const coordDisplay = document.getElementById('coordDisplay');

    const defaultLat = 13.5282;
    const defaultLng = 99.8134;

    const map = L.map('mapPlaceholder').setView([defaultLat, defaultLng], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    setTimeout(() => {
      map.invalidateSize();
    }, 300);

    let marker = null;

    function updateCoordFields(lat, lng) {
      const latFixed = parseFloat(lat).toFixed(6);
      const lngFixed = parseFloat(lng).toFixed(6);
      latInput.value = latFixed;
      lngInput.value = lngFixed;
      coordDisplay.textContent = `${latFixed}, ${lngFixed}`;
    }

    function placeMarker(lat, lng) {
      if (marker) {
        marker.setLatLng([lat, lng]);
      } else {
        marker = L.marker([lat, lng], { draggable: true }).addTo(map);
        marker.on('dragend', () => {
          const pos = marker.getLatLng();
          updateCoordFields(pos.lat, pos.lng);
        });
      }
      updateCoordFields(lat, lng);
    }

    map.on('click', (e) => {
      placeMarker(e.latlng.lat, e.latlng.lng);
    });

    document.getElementById('findCoordBtn').addEventListener('click', () => {
      const lat = parseFloat(latInput.value);
      const lng = parseFloat(lngInput.value);

      if (isNaN(lat) || isNaN(lng)) {
        alert('กรุณากรอกละติจูดและลองจิจูดเป็นตัวเลขก่อนค้นหาพิกัด');
        return;
      }

      map.setView([lat, lng], 15);
      placeMarker(lat, lng);
    });

    // ===== 🛠️ สคริปต์โหลดข้อมูลเก่าสำหรับโหมด "แก้ไข" =====
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const gardenId = urlParams.get('id');

      if (gardenId) {
        try {
          const response = await fetch(`/api/owner/gardens/${gardenId}`);
          if (!response.ok) return;

          const data = await response.json();
          const garden = data.garden;

          if (!garden) return;

          // เติมข้อมูลลงช่องกรอก
          document.getElementById('gardenName').value = garden.garden_name || '';
          document.getElementById('gardenDesc').value = garden.description || '';
          document.getElementById('phone').value = garden.contact?.phone || '';
          document.getElementById('facebook').value = garden.contact?.facebook || '';
          document.getElementById('lineId').value = garden.contact?.line || '';
          
          document.getElementById('addressNo').value = garden.address?.address_no || '';
          document.getElementById('moo').value = garden.address?.moo || '';
          document.getElementById('soi').value = garden.address?.soi || '';
          document.getElementById('road').value = garden.address?.road || '';
          document.getElementById('subdistrict').value = garden.address?.subdistrict || '';
          document.getElementById('district').value = garden.address?.district || '';
          document.getElementById('province').value = garden.address?.province || '';

          // แสดงรูปภาพเดิม (ถ้ามี)
          if (garden.images && garden.images.length > 0) {
            imagePreview.innerHTML = '';
            garden.images.forEach(imgUrl => {
              const img = document.createElement('img');
              img.src = imgUrl;
              imagePreview.appendChild(img);
            });
          }

          // ปักหมุดพิกัดเดิม
          if (garden.location?.lat && garden.location?.lng) {
            placeMarker(garden.location.lat, garden.location.lng);
            map.setView([garden.location.lat, garden.location.lng], 15);
          }

        } catch (err) {
          console.error('Error loading garden details:', err);
        }
      }
    });

    // ===== 🛠️ บันทึก/แก้ไข ข้อมูลสวน =====
    const gardenForm = document.getElementById('gardenForm');
    const saveBtn = gardenForm.querySelector('.btn-save');

    gardenForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const urlParams = new URLSearchParams(window.location.search);
      const gardenId = urlParams.get('id');

      const messageBox = document.getElementById('formMessage');
      const gardenName = document.getElementById('gardenName').value.trim();

      if (!gardenName) {
        messageBox.style.color = '#dc2626';
        messageBox.textContent = 'กรุณากรอกชื่อสวน';
        return;
      }

      // ถ้ามี gardenId จะยิง PUT ไปแก้ไข / ถ้าไม่มี จะยิง POST ไปสร้างใหม่
      const url = gardenId ? `/api/owner/gardens/${gardenId}` : '/api/owner/gardens';
      const method = gardenId ? 'PUT' : 'POST';

      const formData = new FormData();
      formData.append('gardenName', gardenName);
      formData.append('description', document.getElementById('gardenDesc').value);
      formData.append('phone', document.getElementById('phone').value);
      formData.append('facebook', document.getElementById('facebook').value);
      formData.append('lineId', document.getElementById('lineId').value);
      formData.append('addressNo', document.getElementById('addressNo').value);
      formData.append('moo', document.getElementById('moo').value);
      formData.append('soi', document.getElementById('soi').value);
      formData.append('road', document.getElementById('road').value);
      formData.append('subdistrict', document.getElementById('subdistrict').value);
      formData.append('district', document.getElementById('district').value);
      formData.append('province', document.getElementById('province').value);
      formData.append('lat', document.getElementById('lat').value);
      formData.append('lng', document.getElementById('lng').value);

      Array.from(imageInput.files).forEach(file => {
        formData.append('images', file);
      });

      saveBtn.disabled = true;
      saveBtn.textContent = 'กำลังบันทึก...';
      messageBox.textContent = '';

      try {
        const response = await fetch(url, {
          method: method,
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          messageBox.style.color = '#17663f';
          messageBox.textContent = gardenId ? 'แก้ไขข้อมูลสวนสำเร็จ!' : 'บันทึกข้อมูลสวนสำเร็จ!';
          
          setTimeout(() => {
            history.back(); // บันทึกเสร็จแล้วพากลับหน้าสรุปรายการ
          }, 1200);
        } else {
          messageBox.style.color = '#dc2626';
          messageBox.textContent = data.error || 'เกิดข้อผิดพลาด กรุณาลองใหม่';
        }
      } catch (err) {
        messageBox.style.color = '#dc2626';
        messageBox.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบว่า server กำลังรันอยู่';
        console.error(err);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'บันทึกข้อมูลสวน';
      }
    });
  </script>

</body>
</html>
